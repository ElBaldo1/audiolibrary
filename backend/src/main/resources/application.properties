spring.application.name=audiolibrary
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/audiolibrary}
spring.datasource.username=${DB_USERNAME:audiolibrary}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
jwt.secret=${JWT_SECRET}
audiolibrary.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000}
server.error.include-message=never
