# Explicit local profile; never use these settings for a public deployment.
spring.datasource.url=jdbc:h2:file:./.data/audiolibrary;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
jwt.secret=local-development-only-key-do-not-use-in-production-0123456789-abcdef
